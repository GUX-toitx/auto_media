<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lips Sync Queue · Media Team</title>
<style>
    :root {
        --bg: #0f1117; --panel: #1a1d27; --panel-2: #232733; --border: #2e3342;
        --text: #e7e9ee; --muted: #9aa1b1; --accent: #5b8cff; --accent-d: #3f6fe0;
        --danger: #ff5b6e; --ok: #3ecf8e; --warn: #f5b657; --info: #5bc0ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
    h1 { font-size: 22px; margin: 0; }
    a.back { color: var(--accent); text-decoration: none; font-size: 14px; }
    a.back:hover { text-decoration: underline; }
    .sub { color: var(--muted); font-size: 13px; margin: 2px 0 18px; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    button.btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
    button.btn:hover { border-color: var(--accent); }
    button.btn.danger { border-color: rgba(255,91,110,.4); color: var(--danger); }
    button.btn.danger:hover { background: rgba(255,91,110,.12); border-color: var(--danger); }
    button.btn:disabled { opacity: .45; cursor: not-allowed; }
    label.auto { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .runlist { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    .runitem { font-size: 12px; color: var(--text); }
    .runitem b { color: var(--info); font-weight: 700; }
    .runitem code { color: var(--muted); font-family: ui-monospace, monospace; font-size: 11px; }
    .waitgrp { font-size: 12px; color: var(--muted); }
    .waitgrp b { color: var(--text); }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
    .worker { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
    .worker .stat { display: flex; flex-direction: column; }
    .worker .stat b { font-size: 20px; }
    .worker .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .run { font-family: ui-monospace, monospace; font-size: 12px; color: var(--info); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .proj { font-weight: 700; }
    .proj small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
    .bar { width: 160px; height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
    .pill { display: inline-block; min-width: 26px; text-align: center; padding: 1px 7px; border-radius: 999px; font-weight: 800; font-size: 12px; }
    .p-done { background: rgba(62,207,142,.15); color: var(--ok); }
    .p-queue { background: rgba(245,182,87,.15); color: var(--warn); }
    .p-run { background: rgba(91,192,255,.18); color: var(--info); }
    .p-err { background: rgba(255,91,110,.15); color: var(--danger); }
    .p-zero { color: var(--muted); background: transparent; }
    .muted { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>👄 Hàng đợi Lips Sync</h1>
            <div class="sub">Trạng thái các job lips sync theo dự án + worker inference.</div>
        </div>
        <a class="back" href="/">← Về trang dự án</a>
    </header>

    <div class="toolbar">
        <button class="btn" onclick="load()">🔄 Làm mới</button>
        <button class="btn danger" id="clearBtn" onclick="clearAll()">🧹 Xoá toàn bộ hàng đợi</button>
        <label class="auto"><input type="checkbox" id="auto" checked> Tự làm mới 5s</label>
        <span class="muted" id="updated"></span>
    </div>

    <div class="card" id="workerCard">
        <div class="worker" id="worker"><span class="muted">Đang tải trạng thái worker…</span></div>
    </div>

    <div class="card" style="padding:0; overflow:hidden">
        <table>
            <thead>
                <tr>
                    <th>Dự án</th>
                    <th>Tiến độ</th>
                    <th>✅ Xong</th>
                    <th>⏳ Chờ</th>
                    <th>▶️ Chạy</th>
                    <th>❌ Lỗi</th>
                    <th>Cập nhật</th>
                </tr>
            </thead>
            <tbody id="rows">
                <tr><td colspan="7" class="empty">Đang tải…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const $ = (s) => document.querySelector(s);
    function fmtTime(ms) {
        const n = Number(ms); if (!Number.isFinite(n) || n <= 0) return '—';
        try { return new Date(n).toLocaleString('vi-VN'); } catch { return '—'; }
    }
    function pill(v, cls) {
        const n = Number(v) || 0;
        return `<span class="pill ${n ? cls : 'p-zero'}">${n}</span>`;
    }
    async function load() {
        try {
            const r = await fetch('/api/lips-sync/queues');
            const data = await r.json();
            renderWorker(data.queue);
            renderRows(data.projects || []);
            $('#updated').textContent = 'Cập nhật: ' + new Date().toLocaleTimeString('vi-VN');
        } catch (e) {
            $('#rows').innerHTML = `<tr><td colspan="7" class="empty">Lỗi tải: ${e.message}</td></tr>`;
        }
    }
    function renderWorker(q) {
        const w = $('#worker');
        if (!q) { w.innerHTML = '<span class="muted">Không kết nối được server inference (:8010) — chỉ hiển thị số từ DB.</span>'; return; }
        const runInfo = q.runningInfo || (q.running || []).map(id => ({ jobId: id }));
        const waitInfo = q.waitingInfo || (q.waiting || []).map(id => ({ jobId: id }));
        // Job đang chạy: hiện TÊN DỰ ÁN + số câu (job_id trần rất khó tra)
        const runHtml = runInfo.length
            ? `<div class="runlist">${runInfo.map(r => `
                <div class="runitem">▶️ <b>${escapeHtml(r.title || '(không tra được dự án)')}</b>
                ${r.idx != null ? ` · câu #${r.idx}` : ''} <code>${escapeHtml(r.jobId || '')}</code></div>`).join('')}</div>`
            : '<div class="run">—</div>';
        // Đang chờ: gom theo dự án cho dễ nhìn (703 job trần thì không đọc nổi)
        const grp = {};
        for (const r of waitInfo) { const k = r.title || '(không rõ dự án)'; grp[k] = (grp[k] || 0) + 1; }
        const waitHtml = Object.keys(grp).length
            ? `<div class="runlist">${Object.entries(grp).sort((a, b) => b[1] - a[1]).map(([t, n]) =>
                `<div class="waitgrp">⏳ <b>${escapeHtml(t)}</b> — ${n} câu</div>`).join('')}</div>`
            : '<div class="run">—</div>';
        w.innerHTML = `
            <div style="display:flex; gap:22px; flex-wrap:wrap; width:100%">
                <div class="stat"><b>${q.workers ?? '—'}</b><span>Worker</span></div>
                <div class="stat"><b>${runInfo.length}</b><span>Đang chạy</span></div>
                <div class="stat"><b>${waitInfo.length}</b><span>Đang chờ</span></div>
            </div>
            <div style="flex:1; min-width:260px"><span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Job đang chạy</span>${runHtml}</div>
            <div style="flex:1; min-width:260px"><span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Đang chờ theo dự án</span>${waitHtml}</div>
        `;
    }

    async function clearAll() {
        const btn = $('#clearBtn');
        if (!confirm('Xoá TOÀN BỘ hàng đợi lips sync của mọi dự án?\n\nJob đang chạy sẽ được chạy nốt, phần còn lại bị huỷ.')) return;
        btn.disabled = true;
        const old = btn.textContent;
        btn.textContent = '⏳ Đang xoá...';
        try {
            const r = await (await fetch('/api/lips-sync/clear-all', { method: 'POST' })).json();
            if (r.ok) alert(`✅ Đã huỷ ${r.cancelled} job.` + (r.running?.length ? `\n${r.running.length} job đang chạy sẽ chạy nốt.` : ''));
            else alert('❌ ' + (r.error || 'Lỗi'));
        } catch (e) { alert('❌ ' + e.message); }
        finally { btn.disabled = false; btn.textContent = old; load(); }
    }
    function renderRows(projects) {
        if (!projects.length) { $('#rows').innerHTML = '<tr><td colspan="7" class="empty">Chưa có job lips sync nào.</td></tr>'; return; }
        $('#rows').innerHTML = projects.map(p => {
            const total = Number(p.total) || 0;
            const done = Number(p.done) || 0;
            const pct = total ? Math.round(done / total * 100) : 0;
            return `<tr>
                <td class="proj">${escapeHtml(p.title || p.projectId || ('post ' + p.postId))}<small>${escapeHtml(p.projectId || '')}</small></td>
                <td>
                    <div class="bar"><i style="width:${pct}%"></i></div>
                    <small class="muted">${done}/${total} · ${pct}%</small>
                </td>
                <td>${pill(p.done, 'p-done')}</td>
                <td>${pill(p.queued, 'p-queue')}</td>
                <td>${pill(p.running, 'p-run')}</td>
                <td>${pill(p.error, 'p-err')}</td>
                <td class="muted">${fmtTime(p.updatedAt)}</td>
            </tr>`;
        }).join('');
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    let timer = null;
    function setupAuto() {
        if (timer) { clearInterval(timer); timer = null; }
        if ($('#auto').checked) timer = setInterval(load, 5000);
    }
    $('#auto').addEventListener('change', setupAuto);
    load();
    setupAuto();
</script>
</body>
</html>
